<section id="contact" class="section">
    <h2 class="text-4xl font-bold mb-8 text-center soft-green-text">Контакти</h2>
    <div class="grid md:grid-cols-2 gap-8">
        <div class="service-card">
            <div class="content">
                <form class="space-y-4">
                    <div>
                        <label for="name" class="block text-gray-300 mb-1">Име</label>
                        <input type="text" id="name" class="w-full p-2 bg-gray-700 rounded-md border border-gray-600 focus:outline-none focus:border-cyan-400">
                    </div>
                    <div>
                        <label for="email" class="block text-gray-300 mb-1">Имейл</label>
                        <input type="email" id="email" class="w-full p-2 bg-gray-700 rounded-md border border-gray-600 focus:outline-none focus:border-cyan-400">
                    </div>
                    <div>
                        <label for="message" class="block text-gray-300 mb-1">Съобщение</label>
                        <textarea id="message" rows="4" class="w-full p-2 bg-gray-700 rounded-md border border-gray-600 focus:outline-none focus:border-cyan-400"></textarea>
                    </div>
                    <button type="submit" class="btn-more w-full">Изпрати</button>
                </form>
            </div>
        </div>
        <div class="service-card">
            <div class="content">
                <h4 class="text-xl font-bold mb-2 text-center text-cyan-400">Разговаряйте с нашия AI асистент ✨</h4>
                <div class="chat-container">
                    <div id="chatMessages" class="chat-messages"></div>
                    <div class="p-4 flex space-x-2 items-center border-t border-gray-600">
                         <input type="file" id="chatImageInput" accept="image/*" class="hidden">
                        <label for="chatImageInput" class="cursor-pointer p-2 bg-gray-700 rounded-md hover:bg-gray-600" title="Прикачи изображение">📎</label>
                        <input type="text" id="chatInput" class="flex-grow p-2 bg-gray-700 rounded-md border border-gray-600 focus:outline-none focus:border-cyan-400" placeholder="Въведете вашето съобщение...">
                        <button id="chatSendBtn" class="btn-more">Изпрати</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
